name: Clean Atlantis Data
run-name: "Clean Atlantis data for PR #${{ github.event.pull_request.number }}"
on:
  pull_request:
    types: [closed]

permissions:
  id-token: write

jobs:
  clean-atlantis-data:
    runs-on: ubuntu-24.04
    environment: main
    container:
      image: ghcr.io/andrey-parkhomets/iac:sha-00e922e
      options: --user root
    env:
      ATLANTIS_DATA_ACCOUNT: stpocuu28
      ATLANTIS_DATA_CONTAINER: atlantis
      ATLANTIS_DATA_BLOB: pr-${{ github.event.pull_request.number }}.tgz
    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Delete Atlantis data blob
        run: |
          az storage blob delete --auth-mode login --account-name "$ATLANTIS_DATA_ACCOUNT" \
            -c "$ATLANTIS_DATA_CONTAINER" -n "$ATLANTIS_DATA_BLOB" --only-show-errors || true
