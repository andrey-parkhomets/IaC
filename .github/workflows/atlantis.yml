# Runs Atlantis inside a GitHub Actions job: start server, relay this event to it, stop.
# Portable to a hosted Atlantis (AKS, container): image, repo config, ARM_*/ATLANTIS_* settings.
# GHA-only glue, dropped when hosted: event relay and the blob that carries the data dir
# between runs (a hosted server keeps it on a volume and cleans up on PR close itself).
name: 'Atlantis'

run-name: >-
  ${{ github.event_name == 'issue_comment' &&
      format('{0} for PR #{1}', github.event.comment.body, github.event.issue.number)
    || github.event_name == 'pull_request' &&
      format('pull_request {0} for PR #{1}', github.event.action, github.event.pull_request.number) }}

on:
  # Issue comments target default branch so workflow definition in main (rather than PR) is used
  issue_comment:
    types:
      - created
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      # Atlantis deletes the PR's working dir and locks; the job then deletes the data blob
      - closed

permissions:
  checks: write
  contents: write
  issues: write
  pull-requests: write
  statuses: write
  id-token: write

jobs:
  atlantis:
    name: Atlantis
    # Only PR events and comments on PRs (not on plain issues)
    if: github.event_name == 'pull_request' || github.event.issue.pull_request
    runs-on: ubuntu-24.04
    # Environment secrets + OIDC subject "...:environment:main"
    environment: main
    # Runs of the same PR share one data blob, so never run them in parallel
    concurrency:
      group: atlantis-pr-${{ github.event.pull_request.number || github.event.issue.number }}
      cancel-in-progress: false
    env:
      # GHA-only: where the Atlantis data dir is kept between runs
      ATLANTIS_DATA_ACCOUNT: stpocuu28
      ATLANTIS_DATA_CONTAINER: atlantis
      ATLANTIS_DATA_BLOB: pr-${{ github.event.pull_request.number || github.event.issue.number }}.tgz
    container:
      image: ghcr.io/andrey-parkhomets/iac:sha-00e922e # atlantis + azure-cli + hcledit/hcl-get
      env:
        # azurerm provider/backend fetch fresh OIDC tokens themselves; subscription comes from backend.hcl
        ARM_USE_OIDC: true
        ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        ATLANTIS_GH_USER: ${{ github.actor }}
        ATLANTIS_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        ATLANTIS_LOCKING_DB_TYPE: boltdb #redis
        # ATLANTIS_REDIS_HOST: ${{ secrets.REDIS_HOST }} #redis
        # ATLANTIS_REDIS_PASSWORD: ${{secrets.REDIS_PASSWORD  }}
        # ATLANTIS_REDIS_PORT: ${{secrets.REDIS_PORT  }}
        ATLANTIS_REPO_ALLOWLIST: github.com/${{ github.repository }}
        ATLANTIS_DISABLE_AUTOPLAN: false
        # Base image ships no terraform; Atlantis downloads it into the data dir
        ATLANTIS_DEFAULT_TF_VERSION: 1.12.2
      options: --user root

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Atlantis data dir (plans, locks) lives in blob storage per PR: GHA caches are
      # ref-scoped (pull_request vs issue_comment on main) and issue_comment can't write them
      - name: Restore Atlantis data
        id: restore-atlantis-data
        timeout-minutes: 5
        run: |
          mkdir -p atlantis-data
          if [ "$(az storage blob exists --auth-mode login --account-name "$ATLANTIS_DATA_ACCOUNT" \
                  -c "$ATLANTIS_DATA_CONTAINER" -n "$ATLANTIS_DATA_BLOB" --query exists -o tsv)" = true ]; then
            az storage blob download --auth-mode login --account-name "$ATLANTIS_DATA_ACCOUNT" \
              -c "$ATLANTIS_DATA_CONTAINER" -n "$ATLANTIS_DATA_BLOB" -f /tmp/atlantis-data.tgz --only-show-errors -o none
            tar -xzf /tmp/atlantis-data.tgz -C atlantis-data
            echo "Restored $ATLANTIS_DATA_BLOB"
          else
            echo "No saved data for $ATLANTIS_DATA_BLOB, starting fresh"
          fi

      - name: Run Atlantis
        timeout-minutes: 15
        run: |
          # Start server in background
          echo "===================="
          # ls -la  ${GITHUB_WORKSPACE}/atlantis-data/*
          echo "===================="
          #
          atlantis server --repo-config .github/workflows/config/atlantis_repoConfig.yaml --data-dir ${GITHUB_WORKSPACE}/atlantis-data &
          atlantis_pid=$!
          
          # Wait for Atlantis to start
          until curl --output /dev/null --silent --fail http://localhost:4141/healthz; do
            sleep 5
          done
          
          # Relay event
          curl --silent --request POST \
            --header 'Content-Type: application/json' \
            --header 'X-GitHub-Event: ${{ github.event_name }}' \
            --header 'X-GitHub-Delivery: ${{ github.run_id }}' \
            --data '${{ toJson(github.event) }}' \
            http://localhost:4141/events
          
          # Wait for Atlantis to run
          sleep 5
          until curl --silent http://localhost:4141/status | grep '"in_progress_operations": 0'; do
            sleep 5
          done
          
          # Wait for Atlantis to exit gracefully (GitHub Actions sends SIGKILL instead of SIGTERM at the end)
          kill $atlantis_pid
          wait $atlantis_pid

      # Fresh login: the OIDC assertion from the first one may have expired during a long run
      - name: Azure login (save)
        if: always() && steps.restore-atlantis-data.outcome == 'success'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Asked after the run: Atlantis may just have automerged the PR. That merge is done with
      # GITHUB_TOKEN, so GitHub never delivers its "closed" event to a new run.
      - name: PR state
        id: pr-state
        if: always() && steps.restore-atlantis-data.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: context.payload.pull_request?.number ?? context.payload.issue.number,
            });
            core.setOutput('state', data.state);

      - name: Save Atlantis data
        if: always() && steps.pr-state.outputs.state == 'open'
        timeout-minutes: 5
        run: |
          # bin/ only holds downloaded terraform binaries, re-fetched on demand
          tar -czf /tmp/atlantis-data.tgz -C atlantis-data --exclude ./bin .
          az storage blob upload --auth-mode login --account-name "$ATLANTIS_DATA_ACCOUNT" \
            -c "$ATLANTIS_DATA_CONTAINER" -n "$ATLANTIS_DATA_BLOB" -f /tmp/atlantis-data.tgz \
            --overwrite --only-show-errors -o none
          echo "Saved $ATLANTIS_DATA_BLOB ($(du -h /tmp/atlantis-data.tgz | cut -f1))"

      - name: Delete Atlantis data
        if: always() && steps.pr-state.outputs.state == 'closed'
        timeout-minutes: 5
        run: |
          az storage blob delete --auth-mode login --account-name "$ATLANTIS_DATA_ACCOUNT" \
            -c "$ATLANTIS_DATA_CONTAINER" -n "$ATLANTIS_DATA_BLOB" --only-show-errors || true
          echo "Deleted $ATLANTIS_DATA_BLOB (PR closed)"

